# The 2004 LoRA's retraining settings (the realism work, phase 7, round 2: after the first blind test), for train.py,
# as lora.yaml (the same model, rank, rate and schedule) for the retrain's data dir (phase7-data-r2): 3,800 training
# examples (the first 3,000 written and the retrain's 1,000, less 150 + 50 kept for the valid loss), one example a
# micro-batch, an optimizer step every 4. build-model.sh checks iters and save_every against the assembled rows:
#   LORA_CONFIG=web/engine/bots/test/model-data/lora-r2.yaml PHASE7_DATA=.../phase7-data-r2 build-model.sh ...
train: true
fine_tune_type: lora
optimizer: adamw
seed: 7
num_layers: -1              # every block (24)
batch_size: 1
grad_accumulation_steps: 4  # an effective batch of 4
iters: 11400                # 3 epochs of 3,800 (2,850 optimizer steps)
val_batches: -1             # the whole valid set
learning_rate: 1.0e-4
lr_schedule:
  name: cosine_decay
  warmup: 50                # optimizer steps
  warmup_init: 1.0e-6
  arguments: [1.0e-4, 2799, 1.0e-6]   # (2,850 steps less the warmup's 51)
steps_per_report: 150
steps_per_eval: 3800        # the valid loss after each epoch
save_every: 3800            # the adapters after each epoch
max_seq_length: 1024
grad_checkpoint: false
mask_prompt: true
lora_parameters:
  rank: 16
  scale: 2.0                # alpha 32 / rank 16
  dropout: 0.05
