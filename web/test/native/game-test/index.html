<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>LostCity native layer test</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; overflow: hidden;
    font: 11px/1.3 ui-monospace, Menlo, monospace; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; touch-action: none; }
  #game { position: absolute; left: 50%; top: 0; height: 100%; aspect-ratio: 765 / 503; transform: translateX(-50%);
    background: linear-gradient(#4a3b22, #1c150b); border-left: 1px solid #5a4a2a; border-right: 1px solid #5a4a2a; }
  #chat { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); width: 60%; color: #ff0;
    font: 15px/1.2 Georgia, serif; text-shadow: 1px 1px #000; }
  #log { position: absolute; top: 6px; left: calc(env(safe-area-inset-left) + 6px); right: calc(env(safe-area-inset-right) + 6px);
    white-space: pre-wrap; }
  .pass { color: #7d7; } .fail { color: #f66; } .info { color: #fc4; }
</style>
</head>
<body>
<div id="game"></div>
<div id="log"></div>
<div id="chat"></div>
<script type="module" src="test.js"></script>
</body>
</html>
