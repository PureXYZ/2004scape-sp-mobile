# The Mac is shared with other builds and an emulator: 2 GB for the Gradle daemon is enough for this app.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Reuse the configuration between builds when the build scripts did not change.
org.gradle.configuration-cache=true
